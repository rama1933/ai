<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pre-paint default only: a meta tag cannot read a CSS variable, so
         useTheme.ts rewrites this from --c-primary / --c-bg as soon as it runs,
         which also keeps it in step with the in-app toggle rather than the OS. -->
    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="description"
      content="Agentic RAG Assistant — pencarian dokumen, OCR, dan SQL dengan model lokal."
    />
    <title>Agentic RAG Assistant</title>

    <!-- Typography: Space Grotesk for display, DM Sans for body. The system
         stack in tailwind.config.js takes over if these never arrive, so the
         app still reads correctly offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
